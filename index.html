<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Archi Map : apprendre quelles architectures logicielles choisir selon le secteur, le type de logiciel et la taille de l’entreprise." />
    <meta property="og:title" content="Archi Map" />
    <meta property="og:description" content="Les architectures logicielles, secteur par secteur, avec du code et des arborescences réelles." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%232b59c3'/%3E%3Ccircle cx='5' cy='8' r='3' fill='%232b59c3'/%3E%3Ccircle cx='27' cy='8' r='3' fill='%232b59c3'/%3E%3Ccircle cx='16' cy='28' r='3' fill='%232b59c3'/%3E%3C/svg%3E" />
    <title>Archi Map</title>
    <script>
      // Applique le thème avant l'affichage pour éviter un flash de la mauvaise couleur.
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('archi-map:progress:v1');
          if (raw) theme = JSON.parse(raw).theme || 'system';
        } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
